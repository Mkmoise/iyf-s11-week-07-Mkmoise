<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="notes-application-wrapper">

        <h1 class="notes-application-heading">
            My Notes
        </h1>

        <textarea
            id="notes-entry-field"
            class="notes-entry-area"
            placeholder="Write your notes here..."></textarea>

        <br>

        <button
            id="save-notes-button"
            class="save-notes-control">
            Save Notes
        </button>

        <button
            id="clear-notes-button"
            class="clear-notes-control">
            Clear Notes
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
