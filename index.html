<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="todo-application-wrapper">

        <h1 class="application-main-heading">
            My To-Do List
        </h1>

        <section class="task-management-panel">

            <input
                type="text"
                id="task-entry-field"
                class="task-entry-input"
                placeholder="Enter a new task"
            >

            <button
                id="create-task-button"
                class="create-task-control">
                Add Task
            </button>

            <div class="task-filter-panel">

                <button
                    id="display-all-tasks-button"
                    class="task-filter-button">
                    All
                </button>

                <button
                    id="display-active-tasks-button"
                    class="task-filter-button">
                    Active
                </button>

                <button
                    id="display-completed-tasks-button"
                    class="task-filter-button">
                    Completed
                </button>

            </div>

            <ul
                id="task-items-container"
                class="task-items-list">
            </ul>

        </section>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
